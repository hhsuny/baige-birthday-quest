<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fff7e8">
  <title>帛鸽的生日大冒险</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="game-shell">
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">B</span>
        <div>
          <p class="eyebrow">BIRTHDAY QUEST</p>
          <h1>帛鸽的生日大冒险</h1>
        </div>
      </div>
      <div class="toolbar">
        <button id="soundButton" class="icon-button" type="button" title="声音" aria-label="切换声音">♪</button>
        <button id="pauseButton" class="icon-button" type="button" title="暂停" aria-label="暂停游戏">Ⅱ</button>
        <button id="restartButton" class="icon-button" type="button" title="重新开始" aria-label="重新开始">↻</button>
      </div>
    </header>

    <section class="game-frame" aria-label="帛鸽的生日大冒险游戏">
      <canvas id="game" width="960" height="540"></canvas>
      <div class="hud" aria-live="polite">
        <div class="hud-item"><span class="hud-label">蜡烛</span><strong id="candleCount">0 / 8</strong></div>
        <div class="hud-center"><span id="chapter">1-1</span><small>云上生日路</small></div>
        <div class="hud-item hud-lives"><span class="hud-label">勇气</span><strong id="lifeCount">♥ ♥ ♥</strong></div>
      </div>

      <div id="startOverlay" class="overlay">
        <div class="title-scene" aria-hidden="true">
          <span class="pixel-cloud cloud-one"></span>
          <span class="pixel-cloud cloud-two"></span>
          <span class="gift gift-left">★</span>
          <span class="gift gift-right">♪</span>
          <span class="mini-hero"><i></i></span>
        </div>
        <p class="level-kicker">SPECIAL STAGE · 08.20</p>
        <h2>为帛鸽而开的<br><span>生日关卡</span></h2>
        <button id="startButton" class="primary-button" type="button">进入关卡 <b>▶</b></button>
      </div>

      <div id="messageOverlay" class="overlay message-overlay" hidden>
        <div class="result-icon" id="resultIcon">★</div>
        <p class="level-kicker" id="resultKicker">LEVEL CLEAR!</p>
        <h2 id="resultTitle">生日快乐，帛鸽！</h2>
        <p id="resultText">愿你的新一岁，每一关都有惊喜，每一次起跳都抵达更好的地方。</p>
        <button id="againButton" class="primary-button" type="button">再玩一次 <b>↻</b></button>
      </div>

      <div id="touchControls" class="touch-controls" aria-label="触屏控制">
        <div class="touch-move">
          <button data-control="left" aria-label="向左">◀</button>
          <button data-control="right" aria-label="向右">▶</button>
        </div>
        <button class="jump-button" data-control="jump" aria-label="跳跃">↑</button>
      </div>
    </section>

    <footer>
      <span>致敬那些一起闯过的关卡</span>
      <span class="footer-badge">MADE FOR BAIGE</span>
    </footer>
  </main>
  <script type="module" src="game.js"></script>
</body>
</html>
